name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with the ZIP (tag v<version from package.json>)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/ci-step.sh "install" pnpm install --frozen-lockfile
      - run: bash scripts/ci-step.sh "ui build" pnpm run build
      - run: bash scripts/ci-step.sh "fetch binaries" python3 scripts/fetch_assets.py --skip-amd
      - run: bash scripts/ci-step.sh "tests" pnpm test
      - run: bash scripts/ci-step.sh "package" python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: FSR-KingSteam
          path: out/*
      - name: Release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: FSR-KingSteam ${{ steps.release.outputs.tag }}
          body: |
            Decky plugin ready to install: in Decky > Settings > Developer > "Install Plugin from ZIP", pick the ZIP below.
            SHA-256 is in the .sha256 file.
          files: out/*
